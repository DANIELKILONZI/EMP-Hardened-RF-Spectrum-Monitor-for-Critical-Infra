# inventory.ini – Ansible host inventory for 50-unit mesh deployment
# ===================================================================
#
# [coordinator]   – Single central coordinator node (runs MeshCoordinator + dashboard)
# [field_units]   – Up to 50 field monitoring nodes
#
# Replace IP addresses with real host IPs or DNS names.
# SSH keys must be pre-distributed to all hosts.

[coordinator]
coord-01 ansible_host=10.0.1.1 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rf_monitor_key

[field_units]
field-01 ansible_host=10.0.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rf_monitor_key unit_id=field-01
field-02 ansible_host=10.0.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rf_monitor_key unit_id=field-02
field-03 ansible_host=10.0.1.13 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rf_monitor_key unit_id=field-03
# ... add remaining field units up to field-50

[all:vars]
coordinator_host=10.0.1.1
coordinator_port=5555
