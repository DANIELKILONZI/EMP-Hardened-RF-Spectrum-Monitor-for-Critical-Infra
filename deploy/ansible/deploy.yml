    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: rf-monitor.service.j2
        dest: /etc/systemd/system/rf-monitor.service
        mode: "0644"
      notify: Reload and restart rf-monitor

    - name: Enable and start rf-monitor service
      ansible.builtin.systemd:
        name: rf-monitor
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload and restart rf-monitor
      ansible.builtin.systemd:
        name: rf-monitor
        state: restarted
        daemon_reload: true
