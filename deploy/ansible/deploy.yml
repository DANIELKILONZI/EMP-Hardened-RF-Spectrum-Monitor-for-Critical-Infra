    venv_dir: "{{ install_dir }}/venv"

  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - libusb-1.0-0
          - rtl-sdr
        state: present
        update_cache: true

    - name: Create rfmonitor system user
      ansible.builtin.user:
        name: "{{ service_user }}"
        system: true
        shell: /bin/false
        home: "{{ install_dir }}"
        create_home: true

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
