<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMP-Hardened RF Spectrum Monitor</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --accent: #58a6ff; --warn: #f0883e;
    --crit: #f85149; --ok: #3fb950; --dim: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px;
           display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; color: var(--accent); }
  #status-badge { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .running { background: #1a3a1a; color: var(--ok); }
  .stopped { background: #3a1a1a; color: var(--crit); }
  #last-update { margin-left: auto; color: var(--dim); font-size: 11px; }

  main { display: grid; grid-template-columns: 1fr 380px; gap: 12px; padding: 12px; height: calc(100vh - 48px); }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
            padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px;
       margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

  /* Waterfall */
  #waterfall-canvas { flex: 1; width: 100%; image-rendering: pixelated; cursor: crosshair; }
  #freq-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); padding-top: 4px; }

  /* Right panel */
  .right-panel { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

  /* Status */
  #status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-card { background: var(--bg); border-radius: 4px; padding: 8px; }
  .stat-card .val { font-size: 20px; font-weight: bold; color: var(--accent); }
  .stat-card .lbl { font-size: 10px; color: var(--dim); margin-top: 2px; }

  /* Detections */
  #detections-list { flex: 1; overflow-y: auto; }
  .det-row { border-bottom: 1px solid var(--border); padding: 6px 4px; font-size: 11px; }
  .det-row .freq { color: var(--accent); font-weight: bold; }
  .det-row .cls { color: var(--warn); }
  .det-row .pwr { color: var(--crit); }
  .det-row .meta { color: var(--dim); font-size: 10px; margin-top: 2px; }
  .severity-critical .freq { color: var(--crit); }
  .severity-warning .freq { color: var(--warn); }

  /* Mesh */
  #mesh-list { overflow-y: auto; max-height: 150px; }
  .mesh-row { display: flex; justify-content: space-between; padding: 4px; border-bottom: 1px solid var(--border); font-size: 11px; }
  .node-online { color: var(--ok); }
  .node-degraded { color: var(--warn); }
  .node-offline { color: var(--crit); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>⚡ EMP-Hardened RF Spectrum Monitor</h1>
  <span id="status-badge" class="stopped">LOADING</span>
  <span id="last-update"></span>
</header>
<main>
  <section>
    <h2>Live Spectrum Waterfall</h2>
    <canvas id="waterfall-canvas"></canvas>
    <div id="freq-axis">
      <span id="freq-start">—</span>
      <span id="freq-mid">—</span>
      <span id="freq-end">—</span>
    </div>
  </section>

  <div class="right-panel">
    <section style="flex:0 0 auto">
      <h2>System Status</h2>
      <div id="status-grid">
        <div class="stat-card"><div class="val" id="stat-scanners">0</div><div class="lbl">Scanners</div></div>
        <div class="stat-card"><div class="val" id="stat-mesh">0</div><div class="lbl">Mesh Nodes Online</div></div>
        <div class="stat-card"><div class="val" id="stat-history">0</div><div class="lbl">History Records</div></div>
        <div class="stat-card"><div class="val" id="stat-detections">0</div><div class="lbl">Total Detections</div></div>
      </div>
    </section>

    <section style="flex:1; overflow:hidden; display:flex; flex-direction:column">
      <h2>Active Detections</h2>
      <div id="detections-list"></div>
    </section>

    <section style="flex:0 0 auto">
      <h2>Mesh Nodes</h2>
      <div id="mesh-list"><div style="color:var(--dim);font-size:11px">No mesh enabled</div></div>
    </section>
  </div>
</main>

<script>
const API_BASE = '';
const REFRESH_MS = 2000;
const WATERFALL_ROWS = 80;
let waterfallBuffer = [];
let canvas, ctx;

function initCanvas() {
  canvas = document.getElementById('waterfall-canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width - 20;
  canvas.height = Math.max(200, rect.height - 60);
  drawWaterfall();
}

function dbToColor(db, minDb, maxDb) {
  const t = Math.max(0, Math.min(1, (db - minDb) / (maxDb - minDb)));
  // cold (blue) → hot (red) gradient
  if (t < 0.25) { const s = t/0.25; return `rgb(0,${Math.round(s*100)},${Math.round(200+s*55)})`; }
  if (t < 0.5)  { const s = (t-0.25)/0.25; return `rgb(0,${Math.round(100+s*155)},${Math.round(255-s*255)})`; }
  if (t < 0.75) { const s = (t-0.5)/0.25; return `rgb(${Math.round(s*255)},255,0)`; }
  const s = (t-0.75)/0.25; return `rgb(255,${Math.round(255-s*255)},0)`;
}

function drawWaterfall() {
  if (!canvas || waterfallBuffer.length === 0) return;
  const rows = waterfallBuffer.slice(-WATERFALL_ROWS);
  const W = canvas.width, H = canvas.height;
  const rowH = H / rows.length;
  const minDb = -120, maxDb = -40;

  const imageData = ctx.createImageData(W, H);
  const data = imageData.data;

  for (let r = 0; r < rows.length; r++) {
    const psd = rows[r].power_db;
    const n = psd.length;
    const y0 = Math.floor(r * rowH), y1 = Math.floor((r+1) * rowH);
    for (let x = 0; x < W; x++) {
      const binIdx = Math.floor(x / W * n);
      const db = psd[Math.min(binIdx, n-1)];
      const t = Math.max(0, Math.min(1, (db - minDb) / (maxDb - minDb)));
      let red, green, blue;
      if (t < 0.25) { const s=t/0.25; red=0; green=Math.round(s*100); blue=Math.round(200+s*55); }
      else if (t < 0.5) { const s=(t-0.25)/0.25; red=0; green=Math.round(100+s*155); blue=Math.round(255-s*255); }
      else if (t < 0.75) { const s=(t-0.5)/0.25; red=Math.round(s*255); green=255; blue=0; }
      else { const s=(t-0.75)/0.25; red=255; green=Math.round(255-s*255); blue=0; }
      for (let y = y0; y < y1; y++) {
        const off = (y * W + x) * 4;
        data[off]=red; data[off+1]=green; data[off+2]=blue; data[off+3]=255;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

async function fetchWaterfall() {
  try {
    const r = await fetch(`${API_BASE}/api/waterfall`);
    const d = await r.json();
    if (d.rows && d.rows.length > 0) {
      waterfallBuffer = d.rows;
      drawWaterfall();
      const fStart = (d.freq_start_hz/1e6).toFixed(1);
      const fEnd   = (d.freq_end_hz/1e6).toFixed(1);
      const fMid   = ((d.freq_start_hz+d.freq_end_hz)/2/1e6).toFixed(1);
      document.getElementById('freq-start').textContent = fStart + ' MHz';
      document.getElementById('freq-mid').textContent   = fMid   + ' MHz';
      document.getElementById('freq-end').textContent   = fEnd   + ' MHz';
    }
  } catch(e) { console.warn('waterfall fetch failed', e); }
}

async function fetchStatus() {
  try {
    const r = await fetch(`${API_BASE}/api/status`);
    const d = await r.json();
    const badge = document.getElementById('status-badge');
    badge.textContent = d.status.toUpperCase();
    badge.className = d.status === 'running' ? 'running' : 'stopped';
    document.getElementById('stat-scanners').textContent = d.scanners.length;
    document.getElementById('stat-mesh').textContent = d.mesh_online;
    document.getElementById('stat-history').textContent = d.history_records;
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {}
}

async function fetchDetections() {
  try {
    const r = await fetch(`${API_BASE}/api/detections?limit=30`);
    const d = await r.json();
    document.getElementById('stat-detections').textContent = d.total;
    const list = document.getElementById('detections-list');
    if (d.detections.length === 0) {
      list.innerHTML = '<div style="color:var(--dim);padding:8px;font-size:11px">No detections</div>';
      return;
    }
    list.innerHTML = d.detections.slice().reverse().map(det => `
      <div class="det-row severity-${det.severity||'info'}">
        <span class="freq">${(det.center_freq_mhz||0).toFixed(3)} MHz</span>
        &nbsp;<span class="cls">${det.signal_class||'unknown'}</span>
        &nbsp;<span class="pwr">${(det.peak_power_dbm||0).toFixed(1)} dBm</span>
        <div class="meta">${det.unit_id} · ${(det.persistence_s||0).toFixed(0)}s · ${new Date((det.last_seen||0)*1000).toLocaleTimeString()}</div>
      </div>`).join('');
  } catch(e) {}
}

async function fetchMesh() {
  try {
    const r = await fetch(`${API_BASE}/api/mesh/nodes`);
    const d = await r.json();
    const list = document.getElementById('mesh-list');
    if (!d.enabled || d.nodes.length === 0) {
      list.innerHTML = '<div style="color:var(--dim);font-size:11px">No mesh enabled</div>';
      return;
    }
    list.innerHTML = d.nodes.map(n => `
      <div class="mesh-row">
        <span>${n.unit_id}</span>
        <span class="node-${n.status}">${n.status.toUpperCase()}</span>
        <span style="color:var(--dim)">${n.detection_count} det</span>
      </div>`).join('');
  } catch(e) {}
}

async function refreshAll() {
  await Promise.all([fetchStatus(), fetchWaterfall(), fetchDetections(), fetchMesh()]);
}

window.addEventListener('load', () => {
  initCanvas();
  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
});
</script>
</body>
</html>
